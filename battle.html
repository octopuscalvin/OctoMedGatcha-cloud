<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>草藥少女戰鬥模擬器</title>
<style>
:root{--bg:#1e1e1e;--panel:#262626;--line:#4a4a4a;--text:#e8e8e8;--muted:#9a9a9a;--red:#e5484d;--green:#46a758;--gold:#f5c542;--blue:#4c8dff;--ally:#b07cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #333;position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:16px;margin:0 10px 0 0}
button,select,input{font:inherit;color:var(--text);background:#333;border:1px solid #555;border-radius:6px;padding:3px 8px}
input[type=number]{width:80px}
button{cursor:pointer}button:hover{background:#3f3f3f}button:disabled{cursor:default;opacity:.6}
button.primary{background:#2d5bd1;border-color:#2d5bd1}
.sep{width:1px;height:22px;background:#444;margin:0 4px}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;padding:16px}
@media(max-width:1050px){main{grid-template-columns:minmax(0,1fr)}}
main>section{min-width:0}
.stage{border:1px solid #bbb;padding:18px 22px 22px;position:relative}
.bar{height:24px;border:1px solid #ccc;position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--green);transition:width .08s linear}
.bar>span{position:absolute;inset:0;text-align:center;font-size:13px;line-height:22px;text-shadow:0 0 3px #000}
.bar.red{height:12px;border-color:var(--red);margin:0 6%}
.bar.red>i{background:var(--red)}
.sub{font-size:12px;color:var(--muted);text-align:center;margin-top:3px}
.disease{margin:20px auto 12px;width:56%;min-height:130px;border:1px solid #ccc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;position:relative;padding:10px}
.disease .nm{font-size:18px}
.tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.tag{font-size:11px;padding:0 6px;border:1px solid #666;border-radius:10px;color:#ddd}
.tag.w{border-color:var(--red);color:#ff9a9c}.tag.l{border-color:var(--green);color:#9be2a6}
.slots{display:grid;grid-template-columns:repeat(3,1fr) 18px repeat(3,1fr);gap:10px;margin-top:20px}
.card{border:1px solid #ccc;min-height:128px;padding:6px 7px;position:relative;cursor:pointer;font-size:12px}
.card.ally{border-color:var(--ally)}
.card.off{opacity:.3}
.card.sel{outline:2px dashed var(--blue);outline-offset:2px}
.card.act{box-shadow:0 0 0 2px var(--gold) inset}
.card .sl{position:absolute;right:6px;top:4px;color:var(--muted);font-weight:bold}
.card .nm{font-size:14px;font-weight:bold;padding-right:14px}
.card .rar{color:var(--gold);letter-spacing:-1px}
.card .st{color:var(--muted);margin-top:2px}
.stance{display:flex;gap:3px;margin-top:4px}
.stance button{flex:1;padding:1px 0;font-size:12px}
.stance button.on.atk{background:#a3343a;border-color:#e5484d}
.stance button.on.heal{background:#2f7d3f;border-color:#46a758}
.crown{color:var(--gold)}
.float{position:absolute;left:50%;top:35%;transform:translateX(-50%);font-weight:bold;font-size:15px;animation:up .9s forwards;pointer-events:none;white-space:nowrap;text-shadow:0 0 3px #000;z-index:3}
.float.atk{color:#ff7b7e}.float.heal{color:#7ee08e}.float.tox{color:#c38bff}
@keyframes up{to{transform:translate(-50%,-44px);opacity:0}}
.cds{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.cd{display:flex;align-items:center;gap:8px;font-size:12px}
.cd>span:first-child{min-width:120px;color:var(--muted)}
.cd .bar{flex:1;height:14px}
.cd .bar>i{background:var(--blue);transition:none}
.cd.ally .bar>i{background:var(--ally)}
.cd.ready .bar>i{background:var(--gold)}
.cd .fire{min-width:96px}
.cd.ready .fire{background:var(--gold);color:#000;border-color:var(--gold);animation:pulse .8s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 10px var(--gold)}}
.result{position:absolute;inset:0;background:rgba(0,0,0,.74);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:15px}
.result b{font-size:28px}
.result[hidden]{display:none}
.panel{background:var(--panel);border:1px solid #333;border-radius:8px;padding:12px;margin-top:14px}
.panel h3{margin:0 0 8px;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid #383838;padding:3px 5px;text-align:right}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
tr.tot td{font-weight:bold;border-top:1px solid #666}
.vs{display:flex;height:18px;border-radius:4px;overflow:hidden;margin:6px 0;font-size:11px;line-height:18px}
.vs div{text-align:center;white-space:nowrap;overflow:hidden}
#log{height:220px;overflow:auto;font:12px/1.45 Consolas,"Microsoft JhengHei",monospace;color:#cfcfcf}
#log .ours{color:#9cc2ff}#log .ally{color:#d3b4ff}#log .sys{color:var(--gold)}#log .sum{color:#7d7d7d}
.panel h3 .acts{float:right;display:flex;gap:4px}.panel h3 .acts button{font-size:12px;padding:1px 8px;font-weight:normal}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border-radius:6px 6px 0 0}
.tabs button.on{background:#2d5bd1;border-color:#2d5bd1}
.f{display:flex;align-items:center;gap:8px;margin:5px 0;flex-wrap:wrap}
.f>span:first-child{min-width:92px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:1px 9px;border-radius:12px;font-size:13px}
.chip.on{background:#2d5bd1;border-color:#2d5bd1}
.note{font-size:12px;color:var(--muted);margin:6px 0}
.preview{background:#1d1d1d;border:1px solid #3a3a3a;border-radius:6px;padding:8px;margin-top:8px;font-size:13px}
.lib{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;font-size:13px}
.lib .btns{display:flex;gap:3px;flex-wrap:wrap}.lib .btns button{padding:0 6px;font-size:12px}
.mini td,.mini th{text-align:left}
.mini input{width:70px}
h4{margin:14px 0 4px;font-size:13px;color:var(--gold)}
.teaminfo{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7}
.teaminfo b{color:var(--text)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
kbd{background:#333;border:1px solid #555;border-radius:3px;padding:0 4px;font-size:11px}
.ok{color:#7ee08e}.no{color:#777}.bad{color:#ff7b7e}
button,select,input,label{touch-action:manipulation}
#stats{overflow-x:auto}
#mbar,#scrim,.drawer-head{display:none}
/* ================= 電話版 ================= */
@media(max-width:640px){
  body{font-size:13px;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  header{position:static;padding:8px 10px;gap:6px}
  header h1{font-size:15px;width:100%;margin:0}
  header label{font-size:12px}
  header #btnPlay,header #btnReset{display:none}
  .sep{display:none}
  button,select,input{font-size:16px;padding:5px 8px}       /* 16px 防 iOS 自動放大 */
  header button,header select{font-size:13px}
  main{padding:8px;gap:10px}
  .stage{padding:10px 10px 12px}
  .bar{height:22px}.bar>span{font-size:12px;line-height:20px}
  .disease{width:100%;min-height:84px;margin:12px 0 8px;padding:8px}
  .disease .nm{font-size:16px}
  .bar.red{margin:0}
  .slots{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
  .slots>div:nth-child(4){grid-column:1/-1;height:0}
  .card{min-height:0;padding:5px;font-size:11px}
  .card .nm{font-size:13px;word-break:break-all}
  .card .sl{right:4px;top:2px}
  .stance button{padding:7px 0;font-size:13px}
  .float{font-size:13px}
  .cd{flex-wrap:wrap;gap:4px}
  .cd>span:first-child{min-width:0;width:100%}
  .cd .fire,.cd .note{display:none}
  .panel{padding:10px;margin-top:10px}
  #stats table{min-width:470px}
  #log{height:260px;font-size:11px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs button{flex:none}
  .f>span:first-child{min-width:72px}
  .chip{padding:4px 10px}
  .lib{grid-template-columns:1fr;gap:2px}
  .lib .btns{margin-bottom:8px}.lib .btns button{padding:4px 10px;font-size:13px}
  .panel h3 .acts{float:none;margin-top:6px}
  .result b{font-size:22px}
  #mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#181818;border-top:1px solid #333}
  #mbar button{font-size:15px;padding:10px 0;flex:1}
  #mbar #mFire{flex:2;font-weight:bold}
  #mbar #mFire.ready{background:var(--gold);color:#000;border-color:var(--gold);animation:pulse .8s infinite alternate}
  /* 右邊抽屜：設定／編輯 */
  #side{position:fixed;top:0;right:0;bottom:0;width:min(88vw,420px);z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
    padding:0 10px calc(16px + env(safe-area-inset-bottom));box-shadow:-6px 0 18px rgba(0,0,0,.55);border-left:1px solid #333;
    transform:translateX(105%);transition:transform .25s ease;visibility:hidden}
  body.drawer #side{transform:none;visibility:visible}
  body.drawer{overflow:hidden}
  body.drawer #scrim{display:block;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.5)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0 8px;margin-bottom:4px;border-bottom:1px solid #333}
  .drawer-head button{padding:4px 12px}
  #side .tabs{position:sticky;top:49px;z-index:2;background:var(--bg);padding-bottom:6px;margin-bottom:6px}
}
</style>
</head>
<body>
<header>
  <h1>🌿 草藥少女戰鬥模擬器</h1>
  <label>模式 <select id="modeSel"></select></label>
  <label>我方操作 <select id="ctrlSel"><option value="manual">手動揀招</option><option value="auto">自動（用預設行動）</option></select></label>
  <label title="CD 滿咗之後停住時間等你揀"><input type="checkbox" id="waitChk"> 揀招時暫停</label>
  <span class="sep"></span>
  <button class="primary" id="btnPlay">▶ 開始</button>
  <button id="btnReset">↺ 重置</button>
  <label>速度 <select id="speedSel"><option selected>1</option><option>2</option><option>5</option><option>10</option><option>20</option></select>x</label>
  <button id="btnInstant" title="用自動模式即刻計結果">⚡ 即時結算</button>
  <button id="btnBatch" title="用自動模式跑 100 場">🎲 模擬 100 次</button>
  <span class="sep"></span>
  <button id="btnExport">匯出 JSON</button>
  <button id="btnImport">匯入 JSON</button>
  <button id="btnDefault" title="清除所有自訂數據">還原預設</button>
  <input type="file" id="fileIn" accept=".json" hidden>
</header>
<main>
  <section>
    <div class="stage" id="stage">
      <div class="bar" id="pBar"><i></i><span></span></div>
      <div class="sub" id="rateTxt"></div>
      <div class="disease" id="dBox" title="點擊編輯病魔"></div>
      <div class="bar red" id="eBar"><i></i></div>
      <div class="sub" id="eTxt"></div>
      <div class="slots" id="slots"></div>
      <div class="cds" id="cds"></div>
      <div class="teaminfo" id="teamInfo"></div>
      <div class="hint" id="hint"></div>
      <div class="result" id="result" hidden></div>
    </div>
    <div class="panel"><h3>輸出統計 <span id="clock" style="float:right;color:var(--muted);font-weight:normal"></span></h3><div id="stats"></div></div>
    <div class="panel"><h3>戰鬥紀錄（由舊到新）<span class="acts"><button id="btnCopyRep" title="複製完整戰報，可以直接貼畀 Claude">📋 複製戰報</button><button id="btnSaveRep">💾 下載戰報</button></span></h3><div id="log"></div></div>
  </section>
  <section id="side">
    <div class="drawer-head"><b>⚙ 設定／編輯</b><button id="drawerClose" aria-label="關閉">✕</button></div>
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="editor" style="margin-top:0"></div>
  </section>
</main>
<div id="scrim"></div>
<div id="mbar">
  <button id="mPlay" class="primary">▶ 開始</button>
  <button id="mFire" disabled>出招</button>
  <button id="mReset">↺</button>
  <button id="mInstant">⚡</button>
  <button id="mDrawer" aria-label="設定／編輯">☰</button>
</div>
<script>
/* ================= 基本資料 ================= */
const isPhone=()=>matchMedia('(max-width:640px)').matches;
// 電話版右邊抽屜
function openDrawer(){document.body.classList.add('drawer')}
function closeDrawer(){document.body.classList.remove('drawer')}
// 撳卡／病魔：電腦照舊；電話喺戰鬥停咗嘅時候先打開抽屜
function showEditor(){if(isPhone()&&!playing)openDrawer()}
const MERIDIANS=['心','肝','脾','肺','腎','胃','大腸','膀胱'];          // 病魔弱點只會係呢 8 個
const ALL_MER=[...MERIDIANS,'膽','小腸','三焦','心包'];             // 少女歸經可以多啲
// 匯入資料庫時當解毒嘅藥：類型 → 藥名（本身有毒嘅「以毒攻毒」藥唔計，匯入時自動剔走）
const DETOX_GROUPS={
  '解百藥毒':['甘草','甘草(炙)','綠豆','綠豆衣','黑大豆 (黑豆)','蜂蜜','蜂蜜(炒)'],
  '解食物／藥物毒':['生薑','紫蘇','白扁豆','葛花','大蒜','防風','土茯苓'],
  '清熱解毒':['金銀花','忍冬藤','連翹','蒲公英','紫花地丁','野菊花','菊花','板藍根','大青葉','青黛','穿心蓮','魚腥草','敗醬草','白頭翁','馬齒莧','射干','馬勃','紅藤','漏蘆','白花蛇舌草','半邊蓮','半枝蓮','拳參','黃連','黃芩','黃柏','梔子','牛蒡子','升麻','虎杖','垂盆草','雞骨草','金錢草','絞股藍','千里光','鬼針草','金蕎麥','蛇莓','委陵菜','翻白草','地錦草','鳳尾草','鴨跖草','苦蕒菜','貓爪草','腫節風','葎草','豬殃殃','珍珠草 (葉下珠)','車前草','馬蘭','苦瓜','仙人掌','白鮮皮','硼砂','爐甘石'],
  '涼血解毒':['紫草','玄參','地榆','大黃','水牛角','犀角 (歷史用藥)','極品天然犀角 (歷史記載)','天然牛黃','人工牛黃','野生天然牛黃','純野生熊膽','黑市極品熊膽粉','豬膽汁','羚羊角','正品野生羚羊角']};
const DETOX_TYPE=Object.fromEntries(Object.entries(DETOX_GROUPS).flatMap(([t,ns])=>ns.map(n=>[n,t])));
const DETOX_ORDER=Object.keys(DETOX_GROUPS);
// 毒／解毒三級：1 小、2 中、3 大。毒傷 = 毒性% × max(0, 毒級 − 解毒級) ÷ 毒級（解毒過頭都只係 0，唔會回血）
const LV=['無','小','中','大'];
const DETOX_LV_BY_TYPE={'解百藥毒':3,'解食物／藥物毒':2,'涼血解毒':2,'清熱解毒':1};
const starOf=(g,R)=>+g.stars||R.rarity[g.rarity].stars;   // 升星：少女可以自己設星數，冇就跟稀有度
const toxLv=g=>{const t=+g.toxic||0;return t>=10?3:t>=5?2:t>0?1:0};
const detoxLv=g=>g.detox?(+g.detoxLv||DETOX_LV_BY_TYPE[g.detoxType||DETOX_TYPE[g.name]]||2):0;
const toxDmg=(g,dl)=>{const p=toxLv(g);return p?(+g.toxic)*Math.max(0,p-dl)/p:0};
// 放咗上網（本草抽卡 GitHub Pages 嘅 battle.html）就要管理員模式；本機 file:// 開唔使。
const HOSTED=/^https?:$/.test(location.protocol);
const ADMIN_KEY='octoMedAdmin';
const GH_DB='https://octopuscalvin.github.io/OctoMedGatcha-cloud/medData.js';
// 網上：同資料夾 medData.js；本機：本草抽卡資料夾 → 網上 → 同資料夾後備副本
const DB_PATHS=HOSTED?['medData.js',GH_DB]:['../OctoMedGatcha-cloud/OctoMedGatcha-cloud/medData.js',GH_DB,'medData.js'];
const NATURES=['寒','涼','平','溫','熱'];
const FLAVORS=['酸','苦','甘','辛','鹹','淡','澀'];
const PATHOS=['無','熱','寒'];
const COUNTER={熱:['寒','涼'],寒:['溫','熱']};      // 病性 → 可對症嘅藥性
const RARITIES=['N','R','SR','SSR','UR'];
const SLOTS=['A','B','C','D','E','F'];
const ACT={atk:'攻',heal:'回'};
const DT=0.05;
const KEY='herbBattleSim.v3';

/* ================= 本草抽卡資料庫 ================= */
let HERBS=[],DB_SRC='';
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.append(s)})}
async function loadDB(){
  for(const p of DB_PATHS){try{await loadScript(p);if(typeof medData!=='undefined'){DB_SRC=p;break}}catch(e){}}
  if(typeof medData==='undefined')return;
  HERBS=medData.map(fromMed);
}
// medData 一條 → 少女：nature 例「苦、辛，大熱，有大毒」= 味，性，毒
function fromMed(m){
  const parts=String(m.nature||'').split(/[，,]/).map(x=>x.trim());
  const flavors=[...new Set((parts[0]||'').split(/[、\s]+/).map(f=>f.replace(/^微/,'')).filter(f=>FLAVORS.includes(f)))];
  const t=(parts[1]||'').split('偏')[0];
  const nature=/熱/.test(t)?'熱':/溫/.test(t)?'溫':/涼/.test(t)?'涼':/寒|冷/.test(t)?(t.startsWith('微')?'涼':'寒'):'平';
  const tox=parts.slice(1).join('');
  const toxic=/大毒/.test(tox)?10:/小毒/.test(tox)?3:/毒/.test(tox)?5:0;
  const meridians=String(m.meridians||'').split(/[、，,\s]+/).filter(Boolean);
  return{name:m.name,rarity:RARITIES.includes(m.rarity)?m.rarity:'N',nature,flavors,meridians,stance:'atk',toxic,detox:!toxic&&!!DETOX_TYPE[m.name],detoxType:toxic?undefined:DETOX_TYPE[m.name],detoxLv:toxic?0:DETOX_LV_BY_TYPE[DETOX_TYPE[m.name]]||0,
    natureRaw:m.nature,primary:m.primary,secondary:m.secondary};
}
function allLib(){const names=new Set(S.library.map(g=>g.name));return[...S.library.map(g=>Object.assign({custom:true},g)),...HERBS.filter(g=>!names.has(g.name))]}
function findHerb(name){return allLib().find(g=>g.name===name)}
// 解毒排先：解毒（按類型）→ 其餘；同組按稀有度高至低
const RANK=g=>g.detox?DETOX_ORDER.indexOf(g.detoxType||'')+1||DETOX_ORDER.length+1:99;
const detoxSort=(a,b)=>detoxLv(b)-detoxLv(a)||RANK(a)-RANK(b)||RARITIES.indexOf(b.rarity)-RARITIES.indexOf(a.rarity);
const detoxLabel=g=>g.detox?LV[detoxLv(g)]+'解毒'+(g.detoxType?'・'+g.detoxType:''):'';
function buildHerbList(){
  const dl=$('#herbList')||document.body.appendChild(h('datalist',{id:'herbList'}));
  dl.replaceChildren(...[...allLib()].sort(detoxSort).map(g=>h('option',{value:g.name},`${g.detox?'🛡'+detoxLabel(g)+' ':''}${g.rarity} ${g.nature} ${g.meridians.join('')}`)));
}

const G=(name,rarity='SR',nature='平',flavors=[],meridians=[],stance='atk',toxic=0,detox=false)=>({name,rarity,nature,flavors,meridians,stance,toxic,detox});

function adopt(s){const d=defaults();const o=Object.assign(d,s);o.rules=Object.assign(defaults().rules,s.rules);[...o.ours,...o.ally,...o.library].forEach(fixGirl);return o}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));S=s&&s.rules&&s.modes?adopt(s):defaults()}catch(e){S=defaults()}}

const E=()=>S.enemies[S.mode];
function getGirl(slot){const i=SLOTS.indexOf(slot);if(i<3)return S.ours[i];return M().six?S.ours[i]:S.ally[i-3]}
function setGirl(slot,g){const i=SLOTS.indexOf(slot);if(i<3||M().six)S.ours[i]=g;else S.ally[i-3]=g}
function slotUsable(slot){const i=SLOTS.indexOf(slot);if(i<3||M().six)return true;return i-3<M().ally}

/* ================= 計算公式 ================= */
const inter=arrs=>arrs.length?arrs.reduce((a,b)=>a.filter(x=>b.includes(x))):[];
const fmt=n=>Math.round(n).toLocaleString();
const fmt1=n=>(Math.round(n*10)/10).toString();
function intervalFor(stars,R){
  const t=[...R.interval].sort((a,b)=>a[0]-b[0]);
  if(R.intervalMode==='step'){let v=t[0][1];for(const[s,iv]of t)if(stars>=s)v=iv;return v}
  if(stars<=t[0][0])return t[0][1];
  for(let i=1;i<t.length;i++)if(stars<=t[i][0]){const[a,x]=t[i-1],[b,y]=t[i];return x+(y-x)*(stars-a)/(b-a)}
  return t[t.length-1][1];
}
function counters(g,en){return !!(COUNTER[en.patho]&&COUNTER[en.patho].includes(g.nature))}
function calcAtk(g,en,R,atkBuff=0){
  const hits=g.meridians.filter(m=>en.weak.includes(m));
  const ctr=counters(g,en);
  const n=hits.length+(R.natureAsWeak&&ctr?1:0);
  const base=n>0?n*R.weakDmg:R.baseDmg;
  const mod=R.rarity[g.rarity].mod;
  return{dmg:base*(1+mod/100)*(1+atkBuff/100),hits,ctr,n,base};
}
function calcHeal(g,en,R){
  const fl=g.flavors.filter(f=>en.likes.includes(f));
  const ctr=counters(g,en);
  let heal=fl.length*R.healPerFlavor+(ctr?R.natureHeal:0);
  if(R.rarityOnHeal)heal*=1+R.rarity[g.rarity].mod/100;
  return{heal,fl,ctr};
}

/* ================= 戰鬥引擎 ================= */
function buildTeams(S,rng){
  const m=S.modes[S.mode];
  const mk=(side,label,slots,girls,leader)=>({side,label,leader,buffHeal:0,buffDmg:0,debuff:0,
    members:slots.map((s,i)=>({slot:s,g:girls[i]})).filter(x=>x.g&&x.g.name)});
  if(m.six)return[mk('ours','我方',SLOTS,S.ours.slice(0,6),S.leaderOn.ours)].filter(t=>t.members.length);
  const T=[mk('ours','我方',['A','B','C'],S.ours.slice(0,3),S.leaderOn.ours)];
  if(m.ally>0){
    let girls=S.ally.slice(0,m.ally);
    const lib=allLib();
    if(m.allyRandom&&lib.length)girls=Array.from({length:m.ally},()=>clone(lib[Math.floor(rng()*lib.length)]));
    T.push(mk('ally','友方',['D','E','F'].slice(0,m.ally),girls,S.leaderOn.ally));
  }
  return T.filter(t=>t.members.length);
}
class Battle{
  // opt.manual：我方要手動出招；opt.wait：CD 滿咗等出招期間停住時間
  constructor(S,rng=Math.random,opt={}){
    this.R=clone(S.rules);this.M=clone(S.modes[S.mode]);this.M.decay.sort((a,b)=>b.above-a.above);
    this.E=clone(S.enemies[S.mode]);this.eMax=Math.max(1,+this.E.maxHp);this.eHp=this.eMax;this.pHp=100;this.t=0;
    this.manual=!!opt.manual;this.wait=!!opt.wait;
    this.over=null;this.events=[];this.log=[];
    this.teams=buildTeams(S,rng).map(t=>this.prep(t));
  }
  prep(tm){
    const R=this.R,gs=tm.members.map(x=>x.g),n=gs.length,lead=tm.leader&&n>=2;
    tm.stars=gs.reduce((s,g)=>s+starOf(g,R),0);
    tm.scale=this.M.starScale||1;                       // 癌魔 6 人：星數門檻 ×2
    tm.interval=intervalFor(tm.stars/tm.scale,R);
    tm.sameNature=lead&&gs.every(g=>g.nature===gs[0].nature);
    tm.commonFlavor=lead?inter(gs.map(g=>g.flavors)):[];
    tm.commonMer=lead?inter(gs.map(g=>g.meridians)):[];
    tm.hasToxic=R.toxicOn&&gs.some(g=>+g.toxic>0);tm.hasDetox=gs.some(g=>g.detox);tm.detoxLv=Math.max(0,...gs.map(detoxLv));
    tm.toxicDebuff=tm.hasToxic&&!tm.hasDetox;
    tm.atkBuff=tm.sameNature?R.buffAtk:0;
    tm.manual=this.manual&&tm.side==='ours';
    tm.timer=R.firstAt0?tm.interval:0;tm.round=0;tm.ready=false;
    tm.members.forEach(x=>Object.assign(x,{dmg:0,heal:0,tox:0,atkN:0,healN:0,choice:x.g.stance||'atk'}));
    return tm;
  }
  ePct(){return this.eHp/this.eMax*100}
  decay(){const p=this.ePct();for(const r of this.M.decay)if(p>r.above)return r;return null}
  waiting(){return this.wait&&this.teams.some(t=>t.ready)}
  ev(slot,side,type,val,text){this.events.push({slot,type,val});if(text)this.log.push({t:this.t,side,text})}
  step(dt){
    if(this.over||this.waiting())return;
    this.t+=dt;
    const d=this.decay();if(d)this.pHp-=d.pct/d.per*dt;
    if(this.M.regen)this.eHp=Math.min(this.eMax,this.eHp+this.M.regen/100*this.eMax*dt);
    if(this.check())return;
    for(const tm of this.teams){
      if(tm.ready)continue;
      tm.timer+=dt;
      while(tm.timer>=tm.interval-1e-9&&!this.over){
        if(tm.manual){tm.timer=tm.interval;tm.ready=true;break}
        tm.timer-=tm.interval;this.autoChoose(tm);this.round(tm);
      }
    }
    this.check();
  }
  fire(tm){if(!tm.ready||this.over)return;tm.ready=false;tm.timer=0;this.round(tm)}
  autoChoose(tm){
    tm.members.forEach(x=>x.choice=x.g.stance||'atk');
    const lim=this.R.autoHealBelow;
    if(lim>0&&this.pHp<lim&&!tm.members.some(x=>x.choice==='heal')){
      let best=null,bv=0;for(const x of tm.members){const v=calcHeal(x.g,this.E,this.R).heal;if(v>bv){bv=v;best=x}}
      if(best)best.choice='heal';
    }
  }
  round(tm){
    tm.round++;const R=this.R,side=tm.side,lbl=`[${tm.label} R${tm.round}]`;
    for(const x of tm.members){
      if(this.over)return;
      const g=x.g;
      if(x.choice==='atk'){
        const a=calcAtk(g,this.E,R,tm.atkBuff);
        this.eHp-=a.dmg;x.dmg+=a.dmg;x.atkN++;
        this.ev(x.slot,side,'atk',a.dmg,`${lbl} ${g.name} 攻擊 -${fmt(a.dmg)}`+(a.hits.length?`（命中 ${a.hits.join('、')}${R.natureAsWeak&&a.ctr?'＋藥性':''}）`:(a.n?'（藥性對症）':'（無弱點）')));
        if(R.toxicOn&&+g.toxic>0){
          const td=toxDmg(g,tm.detoxLv),pl=LV[toxLv(g)]+'毒',dl=tm.detoxLv?`${LV[tm.detoxLv]}解毒`:'';
          if(td>0){this.pHp-=td;x.tox+=td;this.ev(x.slot,side,'tox',td,`　└ ${g.name} 毒性：病人 -${fmt1(td)}%`+(dl?`（${pl}被${dl}減至 ${toxLv(g)-tm.detoxLv}/${toxLv(g)}）`:''))}
          else this.log.push({t:this.t,side,text:`　└ ${g.name} ${pl}被${dl}完全化解（病人 -0%）`});
        }
      }else{
        const hl=calcHeal(g,this.E,R);const before=this.pHp;this.pHp=Math.min(100,this.pHp+hl.heal);
        x.heal+=this.pHp-before;x.healN++;
        this.ev(x.slot,side,'heal',hl.heal,`${lbl} ${g.name} 回復 +${fmt1(hl.heal)}%`+(hl.fl.length?`（合口味 ${hl.fl.join('、')}${hl.ctr?'＋藥性對症':''}）`:(hl.ctr?'（藥性對症）':'（無效：唔啱口味）')));
      }
      if(this.check())return;
    }
    const lead=tm.members[0].slot;
    if(tm.round===1&&tm.commonMer.length){const d=R.buffDmg/100*this.eMax;this.eHp-=d;tm.buffDmg+=d;this.ev(lead,side,'atk',d,`　└ 隊長BUFF 歸經一致(${tm.commonMer.join('')})：病魔一次性 -${fmt(d)}`)}
    if(tm.commonFlavor.length){const b=this.pHp;this.pHp=Math.min(100,this.pHp+R.buffHeal);tm.buffHeal+=this.pHp-b;this.ev(lead,side,'heal',R.buffHeal,`　└ 隊長BUFF 同味(${tm.commonFlavor.join('')})：病人 +${R.buffHeal}%`)}
    if(tm.toxicDebuff){this.pHp-=R.toxicDebuff;tm.debuff+=R.toxicDebuff;this.ev(lead,side,'tox',R.toxicDebuff,`　└ DEBUFF 有毒無解毒：病人 -${R.toxicDebuff}%`)}
    if(!this.check())this.log.push({t:this.t,side:'sum',text:`　＝ 病人 ${fmt1(this.pHp)}%｜病魔 ${fmt(this.eHp)}（${fmt1(this.ePct())}%）`});
  }
  check(){
    if(this.over)return true;
    if(this.eHp<=0){this.eHp=0;this.over='win'}
    else if(this.pHp<=0){this.pHp=0;this.over='lose'}
    else if(this.t>=this.R.maxTime)this.over='timeout';
    if(this.over)this.log.push({t:this.t,side:'sys',text:{win:'★ 病魔生命歸零，戰鬥勝利！',lose:'✖ 病人生命歸零，戰鬥失敗',timeout:'⌛ 超出時間上限'}[this.over]});
    return !!this.over;
  }
  run(){while(!this.over)this.step(DT);return this}
  side(s){
    const tms=this.teams.filter(t=>t.side===s),ms=tms.flatMap(t=>t.members);
    const sum=(a,k)=>a.reduce((v,o)=>v+o[k],0);
    return{n:ms.length,dmg:sum(ms,'dmg')+sum(tms,'buffDmg'),heal:sum(ms,'heal')+sum(tms,'buffHeal'),tox:sum(ms,'tox')+sum(tms,'debuff')};
  }
  // 結果：lose / timeout / full（完全勝利）/ winButLost（戰鬥勝利但我方輸出低過友方）
  outcome(){
    if(this.over!=='win')return this.over;
    const o=this.side('ours'),a=this.side('ally');
    return a.n&&o.dmg<a.dmg?'winButLost':'full';
  }
}

function buildReport(b){

  L.push(`模式：${M.label}｜我方操作：${b.manual?'手動'+(b.wait?'（揀招時暫停）':'（時間照行）'):'自動'}`);
  L.push(`病魔：${en.name}｜生命 ${fmt(b.eMax)}｜弱點 ${en.weak.join('、')||'無'}｜病性 ${en.patho}｜病人嗜 ${en.likes.join('、')||'無'}｜每秒回血 ${M.regen}%`);
  L.push('病人流失：'+M.decay.map(d=>`病魔>${d.above}% 每${d.per}秒-${d.pct}%`).join('；'));
  L.push(`公式：無弱點${R.baseDmg}／每弱點${R.weakDmg}${R.natureAsWeak?'（藥性對症算弱點）':''}｜回復 每味${R.healPerFlavor}% 對症${R.natureHeal}%${R.rarityOnHeal?'（含稀有度）':''}｜毒傷 = 毒性 ×(毒級−隊伍最高解毒級)/毒級，最低 0`);
  L.push(`BUFF：同藥性 攻+${R.buffAtk}%｜同味 病人+${R.buffHeal}%/回合｜歸經一致 病魔-${R.buffDmg}%（一次）｜毒性${R.toxicOn?'開，有毒無解毒 病人-'+R.toxicDebuff+'%/回合':'關'}`);
  if(!b.manual||b.teams.some(t=>!t.manual))L.push(`自動出招：病人<${R.autoHealBelow}% 派回復最強嗰位補血`);
  for(const t of b.teams){
    L.push('',`【${t.label}】${t.members.length}人 ${t.stars}★${t.scale>1?'（門檻×'+t.scale+'）':''} → CD ${fmt1(t.interval)}s｜${t.manual?'手動':'自動'}｜隊長BUFF${t.leader?'':'(關)'}：同藥性${t.sameNature?'✓':'✗'} 同味${t.commonFlavor.length?'✓('+t.commonFlavor.join('')+')':'✗'} 歸經一致${t.commonMer.length?'✓('+t.commonMer.join('')+')':'✗'}${t.hasToxic?(t.toxicDebuff?'｜⚠有毒無解毒':`｜有毒・隊伍${LV[t.detoxLv]}解毒`):''}`);
    for(const x of t.members){const g=x.g,a=calcAtk(g,en,R,t.atkBuff),hl=calcHeal(g,en,R);
      L.push(`  ${x.slot} ${g.name} ${g.rarity}${g.stars?"("+g.stars+"★)":""}｜${g.nature}｜${g.flavors.join('')||'-'}｜${g.meridians.join('')||'-'}｜預設${ACT[g.stance]}｜攻${fmt(a.dmg)}${a.hits.length?'(中'+a.hits.join('')+')':''} 回${fmt1(hl.heal)}%${g.toxic&&R.toxicOn?'｜'+LV[toxLv(g)]+'毒'+g.toxic+'%→實際'+fmt1(toxDmg(g,t.detoxLv))+'%':''}${g.detox?'｜'+LV[detoxLv(g)]+'解毒':''}`)}
  }
  L.push('','----- 戰鬥過程 -----',...b.log.map(logLine));
  L.push('','----- 結果 -----');
  if(!b.over)L.push(`（戰鬥未完，${b.t.toFixed(1)} 秒）`);
  else L.push(`${{full:'完全勝利',winButLost:'戰鬥勝利・但我方失敗',lose:'戰鬥失敗',timeout:'超時'}[b.outcome()]}｜用時 ${b.t.toFixed(1)}s`);
  L.push(`病人 ${fmt1(b.pHp)}%｜病魔 ${fmt(b.eHp)}/${fmt(b.eMax)}`);
  L.push(pad('位 少女',22)+pad('攻次',6)+pad('傷害',9)+pad('回次',6)+pad('有效回復',10)+'毒傷');
  for(const t of b.teams){for(const x of t.members)L.push(pad(`${x.slot} ${x.g.name}`,22)+pad(x.atkN,6)+pad(fmt(x.dmg),9)+pad(x.healN,6)+pad(fmt1(x.heal)+'%',10)+(x.tox?fmt1(x.tox)+'%':'-'));
    if(t.buffDmg||t.buffHeal||t.debuff)L.push(pad(`  ${t.label}BUFF/DEBUFF`,22)+pad('',6)+pad(t.buffDmg?fmt(t.buffDmg):'-',9)+pad('',6)+pad(t.buffHeal?fmt1(t.buffHeal)+'%':'-',10)+(t.debuff?fmt1(t.debuff)+'%':'-'))}
  const o=b.side('ours'),a=b.side('ally');
  L.push(`我方合計：傷害 ${fmt(o.dmg)}｜回復 ${fmt1(o.heal)}%｜毒傷 ${fmt1(o.tox)}%`);
  if(a.n)L.push(`友方合計：傷害 ${fmt(a.dmg)}｜回復 ${fmt1(a.heal)}%｜毒傷 ${fmt1(a.tox)}%`,`輸出比拼：我方 ${fmt1(o.dmg/((o.dmg+a.dmg)||1)*100)}% vs 友方 ${fmt1(a.dmg/((o.dmg+a.dmg)||1)*100)}%`);
  return L.join('\n');
}

function loop(ts){

  const real=Math.min(.1,(ts-last)/1000);last=ts;
  let sim=real*+$('#speedSel').value;
  while(sim>1e-9&&!B.over&&!B.waiting()){const d=Math.min(DT,sim);B.step(d);sim-=d}

}

const LF={q:'',rarity:'',primary:'',secondary:'',weakOnly:false,detox:'',sort:''};
const LIB_SORTS={'':'預設排序',detox:'🛡 解毒排先',rarity:'稀有度高→低',hit:'弱點命中多→少'};
function edLib(){
  const lib=allLib(),uniq=k=>[...new Set(HERBS.map(g=>g[k]).filter(Boolean))];
  const list=h('div',{class:'lib'}),cnt=h('div',{class:'note'});
  const draw=()=>{
    const en=E(),targets=SLOTS.filter(slotUsable);
    const res=lib.filter(g=>(!LF.q||g.name.includes(LF.q))&&(!LF.rarity||g.rarity===LF.rarity)&&(!LF.primary||g.primary===LF.primary)&&(!LF.secondary||g.secondary===LF.secondary)&&(!LF.weakOnly||g.meridians.some(m=>en.weak.includes(m)))
      &&(!LF.detox||(LF.detox==='any'?g.detox:LF.detox==='none'?!g.detox:g.detox&&(g.detoxType||'其他')===LF.detox)));
    const nHit=g=>g.meridians.filter(m=>en.weak.includes(m)).length,rk=g=>RARITIES.indexOf(g.rarity);
    if(LF.sort==='detox')res.sort(detoxSort);
    else if(LF.sort==='rarity')res.sort((a,b)=>rk(b)-rk(a));
    else if(LF.sort==='hit')res.sort((a,b)=>nHit(b)-nHit(a)||rk(b)-rk(a));
    cnt.textContent=`符合 ${res.length} 種${res.length>80?'（只顯示頭 80 種，請再收窄搜尋）':''}`;
    list.replaceChildren(...res.slice(0,80).flatMap(g=>{
      const hit=g.meridians.filter(m=>en.weak.includes(m));
      return[h('div',{title:g.natureRaw||''},h('b',{},g.name),g.custom?h('span',{class:'tag l',style:'margin-left:4px'},'自訂'):null,` ${g.rarity}｜${g.nature}｜${g.flavors.join('')}｜${g.meridians.join('')}`,hit.length?h('span',{class:'bad'},` ⚔${hit.length}`):null,g.toxic?h('span',{class:'bad'},` 毒${g.toxic}%`):null,g.detox?h('span',{class:'ok'},' 🛡'+detoxLabel(g)):null),
        h('div',{class:'btns'},targets.map(s=>h('button',{onclick:()=>{const c=clone(g);delete c.custom;setGirl(s,c);changed()}},s)),
          g.custom?h('button',{title:HERBS.some(x=>x.name===g.name)?'刪除自訂版，還原資料庫版本':'刪除',onclick:()=>{if(confirm('刪除自訂 '+g.name+'？')){S.library=S.library.filter(x=>x.name!==g.name);save();renderEditor()}}},'✕'):null)]}));
  };
  const opt=(k,vals,label)=>h('select',{onchange:e=>{LF[k]=e.target.value;draw()}},h('option',{value:''},label),vals.map(v=>h('option',{value:v,selected:LF[k]===v},v)));
  setTimeout(draw);
  return[h('div',{class:'note'},HERBS.length?`本草抽卡資料庫：${HERBS.length} 種（${DB_SRC}）＋ 自訂 ${S.library.length} 種。資料庫每次開頁重新讀，自訂／改過嘅會蓋過同名資料。`:h('span',{class:'bad'},'⚠ 讀唔到本草抽卡 medData.js，只有自訂少女。')),
    h('div',{class:'f'},h('input',{placeholder:'搜尋藥名',value:LF.q,style:'width:120px',oninput:e=>{LF.q=e.target.value.trim();draw()}}),opt('rarity',RARITIES,'全部稀有度'),opt('primary',uniq('primary'),'全部類別'),opt('secondary',uniq('secondary'),'全部屬性'),
      h('label',{},h('input',{type:'checkbox',checked:LF.weakOnly,onchange:e=>{LF.weakOnly=e.target.checked;draw()}}),' 只顯示打中而家病魔弱點')),
    h('div',{class:'f'},h('select',{onchange:e=>{LF.sort=e.target.value;draw()}},Object.entries(LIB_SORTS).map(([v,t])=>h('option',{value:v,selected:LF.sort===v},t))),
      h('select',{onchange:e=>{LF.detox=e.target.value;draw()}},[['','全部（解毒與否）'],['any','🛡 只顯示解毒'],...DETOX_ORDER.map(t=>[t,'🛡 '+t]),['其他','🛡 其他（自訂）'],['none','冇解毒']].map(([v,t])=>h('option',{value:v,selected:LF.detox===v},t)))),
    cnt,list,
    h('div',{class:'note'},`匯入規則：味取「，」前（微苦→苦）；性取第二段（微寒→涼，平偏溫→平）；有小毒 3%、有毒 5%、有大毒 10%（毒性 1–4% 小毒、5–9% 中毒、10%+ 大毒）。解毒按本草功效分 ${DETOX_ORDER.length} 類（${DETOX_ORDER.map(t=>t+'＝'+LV[DETOX_LV_BY_TYPE[t]]).join('、')}）；本身有毒嘅「以毒攻毒」藥（例如山豆根、重樓、雄黃）唔當解毒。⚔n = 打中病魔幾多個弱點。`)];
}

function initHeader(){
  $('#modeSel').replaceChildren(...Object.entries(S.modes).map(([k,m])=>h('option',{value:k,selected:k===S.mode},m.label)));
  $('#modeSel').onchange=e=>{S.mode=e.target.value;if(!slotUsable(selSlot))selSlot='A';changed();renderEditor()};
  $('#ctrlSel').value=S.control;$('#ctrlSel').onchange=e=>{S.control=e.target.value;changed()};
  $('#waitChk').checked=S.wait;$('#waitChk').onchange=e=>{S.wait=e.target.checked;changed()};
  $('#btnPlay').onclick=$('#mPlay').onclick=()=>{if(B.over)resetBattle();setPlaying(!playing)};
  $('#btnReset').onclick=$('#mReset').onclick=resetBattle;
  $('#mFire').onclick=fireAll;
  $('#mInstant').onclick=()=>$('#btnInstant').click();
  $('#btnInstant').onclick=()=>{setPlaying(false);B=new Battle(S).run();B.events=[];batchRes=null;renderStage();updateUI();renderLog(true)};
  $('#btnBatch').onclick=()=>{
    const N=100;let win=0,full=0,t=0,p=0,od=0,ad=0,hasAlly=false;
    for(let i=0;i<N;i++){const b=new Battle(S).run();const o=b.side('ours'),a=b.side('ally'),oc=b.outcome();if(b.over==='win'){win++;t+=b.t;p+=b.pHp}if(oc==='full')full++;if(a.n)hasAlly=true;od+=o.dmg;ad+=a.dmg}
    resetBattle();
    batchRes=h('div',{class:'preview'},h('b',{},`🎲 自動模擬 ${N} 次結果`),
      h('div',{},`戰鬥勝率 ${win}%｜平均用時 ${win?(t/win).toFixed(1):'-'}s｜勝利時病人平均剩 ${win?fmt1(p/win):'-'}%`),
      hasAlly?h('div',{},`完全勝利（輸出 ≥ 友方）${full}%｜平均輸出 我方 ${fmt(od/N)} vs 友方 ${fmt(ad/N)}`):null,
      M().allyRandom?h('div',{class:'note'},'友方每場隨機抽，所以結果會有變化'):h('div',{class:'note'},'冇隨機因素時每次結果一樣'));
    renderStats();
  };
  $('#btnCopyRep').onclick=e=>{const btn=e.currentTarget;copyText(buildReport(B)).then(ok=>{btn.textContent=ok?'✓ 已複製':'複製失敗，請用下載';setTimeout(()=>btn.textContent='📋 複製戰報',1500)})};
  $('#btnSaveRep').onclick=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');h('a',{href:URL.createObjectURL(new Blob([buildReport(B)],{type:'text/plain;charset=utf-8'})),download:`戰報_${M().label.replace(/[\\/:*?"<>|（）・ ]/g,'')}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.txt`}).click()};
  $('#btnExport').onclick=()=>{const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'})),download:'herb-battle-setup.json'});a.click()};
  $('#btnImport').onclick=()=>$('#fileIn').click();
  $('#fileIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const s=JSON.parse(await f.text());if(!s.rules||!s.modes)throw 0;S=adopt(s);save();initHeader();resetBattle();renderEditor()}catch(_){alert('JSON 格式唔啱')}e.target.value=''};
  $('#btnDefault').onclick=()=>{if(confirm('還原全部預設？自訂數據會清除')){S=defaults();save();initHeader();resetBattle();renderEditor()}};
}
